
name: Build GyroInspector

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build dylib
        run: make FINALPACKAGE=1

      - name: Find dylib
        run: |
          find .theos -type f -name "*.dylib"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: GyroInspector-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: error
