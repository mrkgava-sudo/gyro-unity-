
name: Build GyroInspector

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GyroInspector-build
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
